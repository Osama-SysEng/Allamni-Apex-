services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allamni}
      POSTGRES_USER: ${POSTGRES_USER:-allamni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allamni}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [allamni]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me}
    ports: ["127.0.0.1:6379:6379"]
    networks: [allamni]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    networks: [allamni]

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: auth-service }
    environment:
      JWT_SECRET: ${JWT_SECRET:-replace-me}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
    ports: ["127.0.0.1:8001:8000"]
    networks: [allamni]

  learning-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: learning-service }
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://allamni:change-me@postgres:5432/allamni}
      REDIS_URL: ${REDIS_URL:-redis://:change-me@redis:6379/0}
    depends_on: [postgres, redis]
    ports: ["127.0.0.1:8002:8000"]
    networks: [allamni]

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: ai-service }
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    depends_on: [qdrant]
    ports: ["127.0.0.1:8003:8000"]
    networks: [allamni]

  integration-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args: { SERVICE: integration-service }
    environment:
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USERNAME: ${ODOO_USERNAME:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
    ports: ["127.0.0.1:8004:8000"]
    networks: [allamni]

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.gateway
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      AUTH_URL: http://auth-service:8000
      LEARNING_URL: http://learning-service:8000
      AI_URL: http://ai-service:8000
      INTEGRATION_URL: http://integration-service:8000
    depends_on: [auth-service, learning-service, ai-service, integration-service]
    ports: ["8000:8000"]
    networks: [allamni]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    networks: [allamni]

  grafana:
    image: grafana/grafana:latest
    ports: ["127.0.0.1:3000:3000"]
    networks: [allamni]

volumes:
  postgres_data:
  qdrant_data:

networks:
  allamni:
